name: alexandria_mobile
description: Alexandria — an open-source, ad-free, human-first social reading platform.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: false
  # Both families are OFL and bundled: no runtime font fetching, ever.
  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond[wght].ttf
        - asset: assets/fonts/EBGaramond-Italic[wght].ttf
          style: italic
    - family: UnifrakturMaguntia
      fonts:
        - asset: assets/fonts/UnifrakturMaguntia-Book.ttf
