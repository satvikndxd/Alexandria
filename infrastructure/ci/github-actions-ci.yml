name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Go API — vet & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: apps/api/go.sum
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  web:
    name: Web — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npm run build --workspace @alexandria/web

  migrations:
    name: Postgres — migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alexandria
          POSTGRES_PASSWORD: alexandria
          POSTGRES_DB: alexandria
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alexandria"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations in order
        run: |
          for f in packages/db/migrations/*.sql; do
            echo "== $f"
            PGPASSWORD=alexandria psql -h localhost -U alexandria -d alexandria -v ON_ERROR_STOP=1 -f "$f"
          done
