name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go API — fmt, vet, build, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            apps/api/go.sum
            packages/db/go.mod
      - name: gofmt (no diffs)
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - name: Unit tests (no services required)
        run: go test -race ./internal/domain/... ./internal/auth/... ./internal/ratelimit/... ./internal/migrate/...

  integration:
    name: Go API — integration suite against real Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alexandria
          POSTGRES_PASSWORD: alexandria
          POSTGRES_DB: alexandria
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alexandria"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: apps/api/go.sum
      - name: Apply migrations through the real runner
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://alexandria:alexandria@localhost:5432/alexandria?sslmode=disable
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate status
      - name: Provision the least-privilege application role
        run: |
          psql -h localhost -U alexandria -d alexandria -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'alexandria_app') THEN
              CREATE ROLE alexandria_app LOGIN PASSWORD 'alexandria_app';
            END IF;
          END $$;
          GRANT ALL ON DATABASE alexandria TO alexandria_app;
          SQL
        env:
          PGPASSWORD: alexandria
      - name: Integration tests (RLS, friction, CSRF, spoiler gating)
        working-directory: apps/api
        env:
          ALEXANDRIA_TEST_DATABASE_URL: postgres://alexandria:alexandria@localhost:5432/alexandria?sslmode=disable
        run: go test -race -count=1 ./internal/httpapi/...

  sqlc:
    name: sqlc — generated data layer matches the checked-in code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sqlc-dev/setup-sqlc@v1
        with:
          sqlc-version: "1.27.0"
      - name: Regenerate and fail on drift
        run: |
          cd packages/db && sqlc generate && cd -
          git diff --exit-code -- apps/api/internal/db
        # Drift means a contributor edited queries/ or migrations/ without
        # regenerating: the shipped code would not match the shipped SQL.

  web:
    name: Web — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npm run build --workspace @alexandria/web

  e2e:
    name: Web — Playwright against a live stack
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alexandria
          POSTGRES_PASSWORD: alexandria
          POSTGRES_DB: alexandria
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alexandria"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Migrate
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://alexandria:alexandria@localhost:5432/alexandria?sslmode=disable
        run: go run ./cmd/migrate up
      - name: Seed a readable edition
        env:
          PGPASSWORD: alexandria
        run: |
          psql -h localhost -U alexandria -d alexandria -v ON_ERROR_STOP=1 -c "
            INSERT INTO authors (name,sort_name,slug) VALUES ('Jane Austen','Austen, Jane','jane-austen') ON CONFLICT DO NOTHING;
            INSERT INTO works (slug,title,description,is_public_domain,first_published) VALUES ('pride-and-prejudice','Pride and Prejudice','A novel of manners.',true,1813) ON CONFLICT DO NOTHING;
            INSERT INTO work_authors (work_id,author_id) SELECT w.id,a.id FROM works w,authors a WHERE w.slug='pride-and-prejudice' AND a.slug='jane-austen' ON CONFLICT DO NOTHING;
            INSERT INTO editions (work_id,title,format,language,gutenberg_id) SELECT w.id,'Pride and Prejudice (Gutenberg)','gutenberg','en',1342 FROM works w WHERE w.slug='pride-and-prejudice' ON CONFLICT DO NOTHING;"
      - name: Build web
        env:
          ALEXANDRIA_API_URL: http://127.0.0.1:8080
        run: npm run build --workspace @alexandria/web
      - name: Start API and web
        env:
          DATABASE_URL: postgres://alexandria:alexandria@localhost:5432/alexandria?sslmode=disable
          ALEXANDRIA_API_URL: http://127.0.0.1:8080
          READER_CACHE_DIR: /tmp/alexandria-texts
        run: |
          (cd apps/api && nohup go run ./cmd/api > /tmp/api.log 2>&1 &)
          (nohup npm run start --workspace @alexandria/web > /tmp/web.log 2>&1 &)
          sleep 12
      - name: Playwright
        working-directory: apps/web
        env:
          BASE_URL: http://127.0.0.1:3000
          READER_EDITION_ID: ${{ env.READER_EDITION_ID }}
        run: |
          npx playwright install --with-deps chromium
          export READER_EDITION_ID=$(psql -h localhost -U alexandria -d alexandria -tAc "SELECT id FROM editions WHERE gutenberg_id=1342" )
          npx playwright test

  mobile:
    name: Flutter — analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
